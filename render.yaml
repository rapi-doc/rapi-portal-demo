# Render Blueprint: Rapid Parcels with sign-in, served by `rapidoc serve` on Render's free plan.
# Render → New → Blueprint → this repository. Render asks for the values marked `sync: false`.
# Setup (Auth0 URLs, custom domain, keeping it awake): rapid-parcels/README.md, "Hosting on Render".
services:
  - type: web
    name: rapid-parcels
    runtime: node
    plan: free
    buildCommand: npm ci --prefix deploy && deploy/node_modules/.bin/rapidoc build rapid-parcels
    startCommand: deploy/node_modules/.bin/rapidoc serve rapid-parcels/dist
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public: the client ID is not a secret (it is also in rapid-parcels/.env.example).
      - key: RAPIDOC_AUTH_CLIENT_ID
        value: GGEXHM1XZ0BAIf6VVSzGgPmmMQadBWDR
      - key: RAPIDOC_AUTH_CLIENT_SECRET
        sync: false
      # Encrypts the session cookie; Render generates a random value once.
      - key: RAPIDOC_SESSION_SECRET
        generateValue: true
      # Where readers open the portal; must match the callback URL registered in Auth0.
      - key: RAPIDOC_PUBLIC_URL
        value: https://demo.rapidocui.com
