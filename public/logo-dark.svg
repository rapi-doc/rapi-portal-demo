<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 56" role="img" aria-label="Rapid Parcels">
  <!-- Shadow -->
  <ellipse cx="33" cy="52.5" rx="13" ry="1.8" fill="#000" opacity="0.45"/>
  <!-- Speed lines, tapering away from the box -->
  <g fill="#fef3c7">
    <path d="M18.5 19.6 L18.5 22.4 L5 21 Z"/>
    <path d="M17.5 25.6 L17.5 28.4 L8 27 Z"/>
    <path d="M18.5 31.6 L18.5 34.4 L3 33 Z"/>
  </g>
  <!-- Legs: knees bent mid-stride, small feet -->
  <g fill="none" stroke="#fef3c7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 37.5 C25.5 41.5 23 44 19.5 44.5 C17.5 44.8 15.5 44 14 42.5"/>
    <path d="M37 36 C40 39.5 41.5 43 40.5 47.5 L45.5 48"/>
  </g>
  <g stroke="#3b2410" stroke-width="2" stroke-linejoin="round">
    <!-- Flaps, opened outward -->
    <path d="M23.5 17 L29.5 11 L24.5 2.5 L18 8 Z" fill="#fde047"/>
    <!-- Inside -->
    <path d="M23.5 17 L42 14 L48 8 L29.5 11 Z" fill="#854d0e"/>
    <!-- Right flap stands up in front of the opening -->
    <path d="M42 14 L48 8 L46.5 0.5 L40.5 6 Z" fill="#fef08a"/>
    <!-- Side face -->
    <path d="M42 14 L48 8 L46 29.5 L40 35 Z" fill="#ca8a04"/>
    <!-- Front face, leaning into the run -->
    <path d="M23.5 17 L42 14 L40 35 L21.5 38 Z" fill="#facc15"/>
  </g>
  <!-- Shipping label -->
  <path d="M31.5 21.6 L38.6 20.5 L38.2 26.3 L31.1 27.4 Z" fill="#fffbeb" stroke="#3b2410" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M33 23.6 L36.8 23 M32.8 25.4 L35.4 25" stroke="#3b2410" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
</svg>
