<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" role="img" aria-labelledby="hero-title">
  <title id="hero-title">A price quote, a booked shipment and a tracking timeline, next to the Rapid Parcels mark</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="40" y1="300" x2="300" y2="40">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .card { fill: #0f1a20; stroke: rgba(255,255,255,0.14); }
      .h { fill: #ffffff; font-weight: 700; font-size: 15px; }
      .t { fill: #e5e7eb; font-size: 13px; }
      .m { fill: #9ca3af; font-size: 12px; }
      .track { fill: rgba(255,255,255,0.12); }
    </style>
  </defs>

  <circle cx="180" cy="170" r="230" fill="url(#glow)"/>

  <!-- Mark: speed dashes and the gradient hexagon with a parcel -->
  <g stroke="url(#g)" stroke-width="10" stroke-linecap="round">
    <path d="M36 120h44"/>
    <path d="M58 152h26"/>
    <path d="M30 184h54"/>
  </g>
  <path d="M190 30l76 44v88l-76 44-76-44V74z" fill="url(#g)"/>
  <path d="M190 74l44 25-44 25-44-25z" fill="#ffffff"/>
  <path d="M146 99l44 25v50l-44-25z" fill="#ffffff" opacity="0.88"/>
  <path d="M234 99v50l-44 25v-50z" fill="#ffffff" opacity="0.66"/>
  <path d="M168 86.5l44 25" stroke="#0f172a" stroke-width="5" opacity="0.2"/>

  <!-- Quote card -->
  <g transform="translate(248 150)" filter="url(#shadow)">
    <rect width="256" height="150" rx="16" class="card"/>
    <text x="20" y="32" class="h">Berlin → Paris</text>
    <text x="236" y="32" text-anchor="end" class="m">2.5 kg</text>
    <text x="20" y="62" class="t">Express</text>
    <text x="236" y="62" text-anchor="end" class="mono t">€12.90</text>
    <rect x="20" y="70" width="216" height="6" rx="3" class="track"/>
    <rect x="20" y="70" width="188" height="6" rx="3" fill="#f59e0b"/>
    <text x="20" y="104" class="t">Standard</text>
    <text x="236" y="104" text-anchor="end" class="mono t">€8.40</text>
    <rect x="20" y="112" width="216" height="6" rx="3" class="track"/>
    <rect x="20" y="112" width="108" height="6" rx="3" fill="#2dd4bf"/>
    <text x="20" y="138" class="m">1 day</text>
    <text x="236" y="138" text-anchor="end" class="m">3 days</text>
  </g>

  <!-- Response chip -->
  <g transform="translate(300 118)" filter="url(#shadow)">
    <rect width="150" height="30" rx="15" fill="#ffffff"/>
    <circle cx="16" cy="15" r="5" fill="#16a34a"/>
    <text x="28" y="20" class="mono" font-size="12" font-weight="700" fill="#15803d">201 Created</text>
  </g>

  <!-- Tracking card -->
  <g transform="translate(70 300)" filter="url(#shadow)">
    <rect width="300" height="128" rx="16" class="card"/>
    <text x="20" y="32" class="mono t" font-weight="700">RP123456789FR</text>
    <text x="280" y="32" text-anchor="end" class="m">out for delivery</text>
    <path d="M30 76h172" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M202 76h68" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
    <g fill="#2dd4bf">
      <circle cx="30" cy="76" r="7"/>
      <circle cx="88" cy="76" r="7"/>
      <circle cx="146" cy="76" r="7"/>
    </g>
    <circle cx="204" cy="76" r="11" fill="#f59e0b" opacity="0.3"/>
    <circle cx="204" cy="76" r="7" fill="#f59e0b"/>
    <circle cx="270" cy="76" r="7" fill="#0f1a20" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <g class="m" text-anchor="middle">
      <text x="30" y="108">Booked</text>
      <text x="88" y="108">Picked up</text>
      <text x="146" y="108">At hub</text>
      <text x="204" y="108" fill="#fbbf24" font-weight="700">On its way</text>
      <text x="270" y="108">Delivered</text>
    </g>
  </g>
</svg>
