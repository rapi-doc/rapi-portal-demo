<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Rapid Parcels">
  <defs>
    <linearGradient id="rp-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b8ff0"/>
      <stop offset="1" stop-color="#0a5bb8"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect width="48" height="48" rx="12" fill="url(#rp-tile)"/>
  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M7 21h7"/>
    <path d="M9.5 26.5h4.5"/>
    <path d="M7 32h7"/>
  </g>
  <!-- Parcel: top, front and side faces -->
  <path d="M19 19.5 26 14h14l-7 5.5z" fill="#ffffff"/>
  <path d="M19 19.5h14v16H19z" fill="#ffffff" opacity="0.92"/>
  <path d="M33 19.5 40 14v16l-7 5.5z" fill="#ffffff" opacity="0.7"/>
  <!-- Tape across the parcel -->
  <path d="M24.5 19.5h3v16h-3z" fill="#0a5bb8" opacity="0.28"/>
</svg>
