<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title">
  <title id="banner-title">Three steps from a price quote to a booked parcel, across a map of delivery routes</title>
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f24"/>
      <stop offset="0.6" stop-color="#0f3f3d"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="b-g" gradientUnits="userSpaceOnUse" x1="900" y1="300" x2="1150" y2="40">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="0.2" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="b-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.1"/>
    </pattern>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step { fill: #0f1a20; stroke: rgba(255,255,255,0.14); }
      .n { fill: #0f172a; font-size: 14px; font-weight: 800; }
      .h { fill: #ffffff; font-size: 16px; font-weight: 700; }
      .m { fill: #9ca3af; font-size: 12px; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#b-bg)"/>
  <rect width="1200" height="320" fill="url(#b-dots)"/>
  <rect width="1200" height="320" fill="url(#b-glow)"/>

  <!-- Routes -->
  <g fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 9" opacity="0.6">
    <path d="M60 270Q260 120 470 200"/>
    <path d="M470 200Q640 270 760 110"/>
    <path d="M760 110Q900 10 1060 80"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="60" cy="270" r="12" opacity="0.2"/>
    <circle cx="60" cy="270" r="5"/>
    <circle cx="470" cy="200" r="12" opacity="0.2"/>
    <circle cx="470" cy="200" r="5"/>
    <circle cx="760" cy="110" r="12" opacity="0.2"/>
    <circle cx="760" cy="110" r="5"/>
  </g>
  <!-- Destination pin -->
  <circle cx="1060" cy="80" r="14" fill="#fde047" opacity="0.3"/>
  <path d="M1060 75c-13-15-20-23-20-33a20 20 0 1 1 40 0c0 10-7 18-20 33z" fill="#fde047"/>
  <circle cx="1060" cy="42" r="7.5" fill="#ffffff"/>

  <!-- Mark -->
  <g transform="translate(960 150)">
    <g stroke="url(#b-g)" stroke-width="7" stroke-linecap="round">
      <path d="M10 46h30"/><path d="M24 68h16"/><path d="M6 90h34"/>
    </g>
    <path d="M110 0l52 30v60l-52 30-52-30V30z" fill="url(#b-g)"/>
    <path d="M110 30l30 17-30 17-30-17z" fill="#ffffff"/>
    <path d="M80 47l30 17v34L80 81z" fill="#ffffff" opacity="0.88"/>
    <path d="M140 47v34l-30 17V64z" fill="#ffffff" opacity="0.66"/>
  </g>

  <!-- Steps -->
  <g transform="translate(90 96)">
    <rect width="240" height="128" rx="16" class="step"/>
    <circle cx="36" cy="36" r="16" fill="#f59e0b"/>
    <text x="36" y="41" text-anchor="middle" class="n">1</text>
    <text x="64" y="41" class="h">Quote a price</text>
    <text x="20" y="78" class="mono" font-size="13" fill="#5eead4">GET /rates</text>
    <text x="20" y="104" class="m">Public. No account needed.</text>
  </g>
  <g transform="translate(360 96)">
    <rect width="240" height="128" rx="16" class="step"/>
    <circle cx="36" cy="36" r="16" fill="#fbbf24"/>
    <text x="36" y="41" text-anchor="middle" class="n">2</text>
    <text x="64" y="41" class="h">Get a token</text>
    <text x="20" y="78" class="mono" font-size="13" fill="#fcd34d">shipments:write</text>
    <text x="20" y="104" class="m">Sign in as a shipper.</text>
  </g>
  <g transform="translate(630 96)">
    <rect width="240" height="128" rx="16" class="step"/>
    <circle cx="36" cy="36" r="16" fill="#a78bfa"/>
    <text x="36" y="41" text-anchor="middle" class="n">3</text>
    <text x="64" y="41" class="h">Book it</text>
    <text x="20" y="78" class="mono" font-size="13" fill="#c4b5fd">POST /shipments</text>
    <text x="20" y="104" class="m">One call, one label.</text>
  </g>
</svg>
