site:
  title: Cosmo Cargo Inc.
  description: Interstellar shipping API documentation and developer console.
  announcement:
    text: We're announcing 🧑‍🚀 inter-galactic shipping ✨ for 3025!
    link: /docs/shipping-process
    dismissible: true
    bgColor: "#f76b39"
    textColor: "#000000"
  logo:
    text: COSMO CARGO
    icon: 🚀
    href: /
  headerLinks:
    - label: Documentation
      href: /docs/documentation
    - label: API Catalog
      href: /catalog
    - label: Shipment API
      href: /apis/shipments
    - label: Solutions
      items:
        - label: Shipment Tracking
          icon: satellite
          description: Real-time quantum-entangled tracking across star systems
          href: /docs/tracking
          features:
            - label: Telemetry Stream
              icon: radar
              href: /docs/tracking
            - label: Sub-light Radar
              icon: eye
              href: /docs/tracking
            - label: FTL Ping Monitor
              icon: zap
              href: /docs/tracking
            - label: Event Webhooks
              icon: server
              href: /docs/tutorials/webhook-integration
        - label: Warp Logistics
          icon: zap
          description: FTL delivery for time-critical cargo
          href: /docs/warp-lane-tutorial
          features:
            - label: Hyper-lane Routing
              icon: workflow
              href: /docs/warp-lane-tutorial
            - label: Jump Gate Protocols
              icon: check
              href: /docs/warp-lane-tutorial
            - label: Gravity Well Bypass
              icon: rocket
              href: /docs/warp-lane-tutorial
            - label: Fuel Manifests
              icon: box
              href: /docs/fleet/refueling
    - label: Products
      items:
        - label: Cargo Containers
          icon: box
          description: Interstellar freight specifications and volume standards
          href: /docs/cargo-manifest-guide
        - label: Fleet Operations
          icon: rocket
          description: Warp drive maintenance and sub-light routing
          href: /docs/shipping-process
        - label: Quantum Express
          icon: zap
          description: Priority expedited transport for high-value cargo
          href: /docs/quantum-express
        - label: Customs Clearance
          icon: shield
          description: Automated planetary quarantine and interplanetary customs
          href: /docs/compliance/customs
    - label: Login
      href: /login
  footer:
    columns:
      - title: Product
        links:
          - label: Features
            href: https://rapidocweb.com
          - label: Docs
            href: /docs/documentation
      - title: Company
        links:
          - label: About
            href: /about
          - label: Blog
            href: /blog
          - label: Careers
            href: /careers
      - title: Resources
        links:
          - label: API Reference
            href: /apis/shipments
          - label: Status
            href: /status
          - label: Support
            href: /docs/support/contact
      - title: Legal
        links:
          - label: Privacy
            href: /privacy
          - label: Terms
            href: /terms
          - label: Security
            href: /security
    social:
      - icon: github
        href: https://github.com/rapi-doc/RapiDoc
      - icon: x
        href: https://x.com
      - icon: discord
        href: https://discord.gg
    copyright: © 2026 Cosmo Cargo, Inc. All rights reserved.
    branding: powered by RapiDoc
docs:
  path: ./docs
  toc: true
