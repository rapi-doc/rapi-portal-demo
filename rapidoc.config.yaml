# yaml-language-server: $schema=../astro-rapidoc/packages/rapidoc-portal/schema.json
# Rapid Parcels: the RapiDoc demo portal. Scenario, roles and permissions:
# astro-rapidoc/packages/rapidoc-portal/design/demo-scenario.md. Auth0 setup: auth0-setup.md.
site:
  title: Rapid Parcels Developers
  description: Ship, track and bill parcels with the Rapid Parcels APIs. A fictional company, built to demo RapiDoc.
  logo:
    src: /logo.svg
    text: RAPID PARCELS
  favicon: /logo.svg
  banner:
    message: Demo portal for RapiDoc. Rapid Parcels is fictional; sign in with a test user to see protected APIs.
    href: /docs/authentication
theme:
  primary: "#0f7ae5"
  mode: auto
header:
  links:
    - label: APIs
      items:
        - label: Rates
          href: /apis/rates
          icon: zap
          description: Public prices and service levels
        - label: Shipments
          href: /apis/shipments
          icon: box
          description: Create, list and cancel shipments
        - label: Tracking
          href: /apis/tracking
          icon: satellite
          description: Parcel events and subscriptions
        - label: Carrier Partners
          href: /apis/carriers
          icon: rocket
          description: Manifests, labels and pickups for partners
    - label: Contact sales
      href: /docs/getting-started
      style: button
navigation:
  - label: Documentation
    icon: book
    items:
      - label: Get started
        items:
          - getting-started
          - authentication
          - errors
      - label: Public APIs
        items:
          - rates
          - tracking
      - label: Shipping guides
        autogenerate: shipping
      - label: Partners
        autogenerate: partners
        collapsed: true
      - label: Internal
        autogenerate: internal
        collapsed: true
  - label: Shipments
    icon: code
    api: shipments
  - label: API Catalog
    icon: grid
    catalog: true
apis:
  - id: rates
    spec: ./specs/rates.yaml
    category: Public
  - id: shipments
    spec: ./specs/shipments.yaml
    category: Shipping
  - id: tracking
    spec: ./specs/tracking.yaml
    category: Shipping
  - id: carriers
    spec: ./specs/carriers.yaml
    category: Partners
  - id: billing
    spec: ./specs/billing.yaml
    category: Internal
  - id: admin
    spec: ./specs/admin.json
    category: Internal
footer:
  cta:
    title: Ship your first parcel in minutes
    description: Quote a price with the public Rates API, then book it with the Shipments API.
    links:
      - label: Get started
        href: /docs/getting-started
      - label: Explore the APIs
        href: /catalog
  columns:
    - title: Developers
      links:
        - label: Getting started
          href: /docs/getting-started
        - label: Authentication
          href: /docs/authentication
        - label: Errors
          href: /docs/errors
    - title: APIs
      links:
        - label: Rates
          href: /apis/rates
        - label: Shipments
          href: /apis/shipments
        - label: Tracking
          href: /apis/tracking
  social:
    - icon: github
      href: https://github.com/rapi-doc/RapiDoc
  copyright: Rapid Parcels is a fictional company. Demo portal for RapiDoc.
rapidoc:
  render-style: read
  schema-style: tree

# Sign-in and access rules (demo-scenario.md, section 5). Served with `rapidoc serve`; the client ID and
# secret come from RAPIDOC_AUTH_CLIENT_ID and RAPIDOC_AUTH_CLIENT_SECRET (auth0-setup.md, step 9).
auth:
  issuer: https://rapidocui.us.auth0.com/
  claims:
    groups: https://rapidoc/roles
  logout: idp
access:
  default: public
  rules: # first match wins
    - path: /apis # only redirects to the catalog
      allow: public
    - path: /apis/rates/**
      allow: public
    - path: /apis/shipments/**
      allow: { groups: [shipper, reviewer, platform-admin] }
    - path: /docs/shipping/**
      allow: { groups: [shipper, reviewer, platform-admin] }
    - path: /apis/tracking/**
      allow: { groups: [tracker, reviewer, platform-admin] }
    - path: /apis/carriers/**
      allow: { groups: [carrier-partner, reviewer, platform-admin] }
    - path: /docs/partners/**
      allow: { groups: [carrier-partner, reviewer, platform-admin] }
    - path: /apis/billing/**
      allow: { groups: [finance, platform-admin] }
    - path: /docs/internal/**
      allow: { groups: [finance, platform-admin] }
    - path: /apis/**
      allow: { groups: [platform-admin] }
